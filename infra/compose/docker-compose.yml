name: autodeploy-control
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [control-plane]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [redis-data:/data]
    networks: [control-plane]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]

  api:
    build: ../../back
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [control-plane]
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://localhost:8080/actuator/health | grep -q UP]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  worker:
    build: ../../worker
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      api: { condition: service_healthy }
    networks: [control-plane]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD-SHELL, wget -qO- http://localhost:8080/actuator/health | grep -q UP]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ../../front
    environment:
      NEXT_PUBLIC_API_HEALTH_URL: "/api/v1/health"
    networks: [control-plane]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  gateway:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:${AUTODEPLOY_GATEWAY_PORT}:80"]
    volumes: [../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_started }
    networks: [control-plane]
    security_opt: [no-new-privileges:true]

networks:
  control-plane: {}
volumes:
  postgres-data: {}
  redis-data: {}
