spring:
  application:
    name: autodeploy-agent
agent:
  manifest-signing-key: ${MANIFEST_SIGNING_KEY:}
  control-plane-url: ${CONTROL_PLANE_URL:}
  credential: ${AGENT_CREDENTIAL:}
  server-id: ${AGENT_SERVER_ID:0}
  enrollment-token: ${AGENT_ENROLLMENT_TOKEN:}
  identity-path: ${AGENT_IDENTITY_PATH:/var/lib/autodeploy-agent/identity.json}
  poll-ms: ${AGENT_POLL_MS:5000}
  execution-mode: ${AGENT_EXECUTION_MODE:dry-run}
  github-deploy-key: ${AGENT_GITHUB_DEPLOY_KEY:/tmp/.ssh/github_deploy_key}
  github-known-hosts: ${AGENT_GITHUB_KNOWN_HOSTS:/tmp/.ssh/known_hosts}
  # Required only by the Docker executor. The Agent joins a project's private
  # network temporarily for the HTTP health check and disconnects afterwards.
  container-name: ${AGENT_CONTAINER_NAME:}
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
